# Despliegue gratuito en Render (Blueprint). Alternativa: Railway/Fly.io con el mismo Dockerfile.
services:
  - type: web
    name: gestion-documental-ia
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: COOKIE_SECURE
        value: "true"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL        # pegar la cadena de Neon/Supabase (PostgreSQL gratuito)
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: AI_EXTERNAL_ALLOWED
        value: "true"
