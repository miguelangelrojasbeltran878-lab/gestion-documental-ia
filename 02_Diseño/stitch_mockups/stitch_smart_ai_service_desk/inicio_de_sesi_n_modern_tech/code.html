<script>
        class ThreeJsScene extends HTMLElement {
            constructor() {
                super();
                this.attachShadow({ mode: 'open' });
                this.shadowRoot.innerHTML = `<div id="container" style="width: 100%; height: 100%;"></div>`;
            }
            
            connectedCallback() {
                const src = this.getAttribute('src');
                const container = this.shadowRoot.getElementById('container');
                
                // Decode the source if needed (handling the placeholder)
                let code = src;
                if(code.startsWith('{{DATA:ANIMATION:')) {
                    // This is a placeholder, actual rendering would require replacing it.
                    // For preview purposes, we'll execute the raw code provided in the datastore
                    code = `
const scene = new THREE.Scene();
const width = container.clientWidth || window.innerWidth;
const height = container.clientHeight || window.innerHeight;
const camera = new THREE.PerspectiveCamera(75, width / height, 0.1, 1000);
const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });

renderer.setSize(width, height);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
container.appendChild(renderer.domElement);

// Lighting
const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
scene.add(ambientLight);

const pointLight = new THREE.PointLight(0x2563eb, 2);
pointLight.position.set(5, 5, 5);
scene.add(pointLight);

// Tech-themed geometric objects (Nodes and connections)
const group = new THREE.Group();
scene.add(group);

const geometry = new THREE.IcosahedronGeometry(1.5, 1);
const material = new THREE.MeshPhongMaterial({
    color: 0x2563eb,
    wireframe: true,
    transparent: true,
    opacity: 0.3
});

const centralSphere = new THREE.Mesh(geometry, material);
group.add(centralSphere);

// Small floating bits
for (let i = 0; i < 20; i++) {
    const sGeom = new THREE.SphereGeometry(0.05, 8, 8);
    const sMat = new THREE.MeshPhongMaterial({ color: 0x2563eb });
    const bit = new THREE.Mesh(sGeom, sMat);
    
    bit.position.set(
        (Math.random() - 0.5) * 6,
        (Math.random() - 0.5) * 6,
        (Math.random() - 0.5) * 6
    );
    group.add(bit);
}

camera.position.z = 5;

// Mouse Interaction
let mouseX = 0;
let mouseY = 0;

window.addEventListener('mousemove', (event) => {
    mouseX = (event.clientX / window.innerWidth) - 0.5;
    mouseY = (event.clientY / window.innerHeight) - 0.5;
});

window.addEventListener('resize', () => {
    const w = container.clientWidth || window.innerWidth;
    const h = container.clientHeight || window.innerHeight;
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
    renderer.setSize(w, h);
});

function animate() {
    requestAnimationFrame(animate);
    
    group.rotation.y += 0.005;
    group.rotation.x += 0.002;
    
    // Smooth mouse follow
    group.position.x += (mouseX * 2 - group.position.x) * 0.05;
    group.position.y += (-mouseY * 2 - group.position.y) * 0.05;
    
    renderer.render(scene, camera);
}

animate();
`;
                }

                    func(container, window.THREE);
                } catch (e) {
                    console.error("Error executing 3D scene code:", e);
                }
            }
        }
        customElements.define('threejs-scene', ThreeJsScene);
